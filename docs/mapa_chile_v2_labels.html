<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0A1633; font-family: 'Lato', sans-serif; }
  .wrapper { max-width: 800px; margin: 0 auto; padding: 32px 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  h1 { font-family: 'Playfair Display', serif; color: #C9A86A; font-size: 20px; text-align: center; line-height: 1.4; }
  h1 span { color: #FAF9F6; font-style: italic; }
  .subtitle { font-size: 10px; color: #A6A6A6; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; }
  .ornament { color: #C9A86A; font-size: 13px; letter-spacing: 4px; text-align: center; }
  .source { font-size: 10px; color: #A6A6A6; text-align: center; opacity: 0.7; }

  /* leyenda */
  .legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #A6A6A6; }
  .legend-box { width: 14px; height: 14px; border-radius: 2px; flex-shrink: 0; }

  .tooltip {
    position: fixed; background: #1C1C1C; border: 1px solid #C9A86A;
    color: #FAF9F6; padding: 8px 12px; border-radius: 6px;
    font-size: 11px; pointer-events: none; display: none; z-index: 100; line-height: 1.8;
  }
  .tooltip strong { color: #C9A86A; font-size: 12px; display: block; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="ornament">✦ ✦ ✦</div>
  <h1>Origen de las ganadoras<br><span>por región de Chile</span></h1>
  <div class="subtitle">Miss Universo · Miss Mundo · Miss Internacional · Miss Earth · 1952–2025</div>

  <svg width="760" height="780" viewBox="0 0 760 780" xmlns="http://www.w3.org/2000/svg" id="chile-map">
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- ══════════════ REGIONES ══════════════ -->
    <!-- Arica y Parinacota -->

    <!-- Metropolitana -->

    <text x="365" y="73" fill="#FAF9F6" font-family="Lato,sans-serif" font-size="10" font-weight="700">Tarapacá</text>

    <!-- O'Higgins: 3 -->

    <!-- separador punteado entre Los Lagos y Magallanes -->
    <line x1="30" y1="640" x2="200" y2="640" stroke="#A6A6A6" stroke-width="0.6" stroke-dasharray="4,4"/>
    <text x="60" y="658" fill="#A6A6A6" font-family="Lato,sans-serif" font-size="8" font-style="italic">↓ salto geográfico</text>

  </svg>

  <div class="legend">
    <div class="legend-item"><div class="legend-box" style="background:#C9A86A;"></div>107+ ganadoras</div>
    <div class="legend-item"><div class="legend-box" style="background:#4468a0;"></div>10–20 ganadoras</div>
    <div class="legend-item"><div class="legend-box" style="background:#35568a;"></div>4–9 ganadoras</div>
    <div class="legend-item"><div class="legend-box" style="background:#253d62;"></div>2–5 ganadoras</div>
    <div class="legend-item"><div class="legend-box" style="background:#152238;"></div>1 ganadora</div>
  </div>

  <div class="source">Base de datos propia · 156 registros · 1952–2025</div>
  <div class="ornament">✦</div>
</div>

<div class="tooltip" id="tooltip"></div>
<script>
const data = {
  "r-arica": {name:"Arica y Parinacota", n:1},
  "r-tarapaca": {name:"Tarapacá", n:2},
  "r-antofagasta": {name:"Antofagasta", n:1},
  "r-atacama": {name:"Atacama", n:3},
  "r-coquimbo": {name:"Coquimbo", n:6},
  "r-valparaiso": {name:"Valparaíso", n:12},
  "r-metropolitana": {name:"Metropolitana", n:107},
  "r-ohiggins": {name:"O'Higgins", n:3},
  "r-maule": {name:"Maule", n:1},
  "r-biobio": {name:"Biobío", n:4},
  "r-araucania": {name:"Araucanía", n:5},
  "r-losrios": {name:"Los Ríos", n:3},
  "r-loslagos": {name:"Los Lagos", n:4},
  "r-magallanes": {name:"Magallanes", n:4}
};
const tooltip = document.getElementById('tooltip');
document.querySelectorAll('svg path').forEach(path => {
  const d = data[path.id];
  if (!d) return;
  path.addEventListener('mousemove', e => {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX+14)+'px';
    tooltip.style.top = (e.clientY-10)+'px';
    tooltip.innerHTML = `<strong>${d.name}</strong>${d.n} ganadora${d.n>1?'s':''}<br>1952–2025`;
  });
  path.addEventListener('mouseleave', () => tooltip.style.display='none');
  path.addEventListener('mouseenter', () => path.style.filter='brightness(1.3)');
  path.addEventListener('mouseleave', () => path.style.filter='');
});
</script>
</body>
</html>
